name: Refresh Scryfall bulk indexes

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scryfall-bulk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test indexer without network
        run: python -m unittest discover -s tests -v
      - name: Test Commander Deck Lab logic
        run: |
          node --check deck-lab.js
          node --test tests/deck-lab.test.cjs
      - name: Download and index current Scryfall exports
        run: python update_bulk_data.py
      - name: Verify generated indexes
        run: python verify_indexes.py
      - name: Commit updated indexes if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prints_index.json data/oracle_index.json data/rulings_index.json data/bulk_manifest.json
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore: refresh Scryfall bulk indexes"
            git push
          fi
